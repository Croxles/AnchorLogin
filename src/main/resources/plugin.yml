name: KayitPlugin
version: '${project.version}'
main: com.example.kayit.KayitPlugin
api-version: '26.1.2'
description: Kayıt / giriş sistemi
author: Sen

commands:
  kayit:
    description: Sunucuya kayıt olursunuz
    usage: /kayit <şifre> <şifre>
    aliases: [register]
  gir:
    description: Sunucuya giriş yaparsınız
    usage: /gir <şifre>
    aliases: [login]
  sifredeyisdir:
    description: Şifrenizi değiştirirsiniz
    usage: /sifredeyisdir <eski şifre> <yeni şifre>
    aliases: [sifredegistir]
  sifresifirla:
    description: Bir oyuncunun şifresini sıfırlar (sadece yetkililer)
    usage: /sifresifirla <oyuncu>
    permission: kayit.admin

permissions:
  kayit.admin:
    description: Şifre sıfırlama yetkisi
    default: op
