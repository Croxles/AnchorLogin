name: Build AnchorLogin

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 25
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'

  - name: Build plugin
    run: mvn -B clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: AnchorLogin-JAR
      path: target/AnchorLogin-1.0.0.jar
